name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "30 4 * * *"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Brand assets are not shipped yet. Drop this line once
          # custom_components/powerpool/brand/ holds icon/logo PNGs.
          ignore: brands
