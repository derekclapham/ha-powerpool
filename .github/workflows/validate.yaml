name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "30 4 * * *"

# Validation only ever reads the checkout. Stated explicitly rather than relying
# on the repository's default token permission, which an org or repo setting
# could widen later without anyone revisiting this file.
permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
